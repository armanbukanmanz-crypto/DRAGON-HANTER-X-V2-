<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dragon Hunter Z</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

body{
    overflow:hidden;
    background:#050505;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 80%,#8c1800 0%,#250300 38%,#050505 78%);
}

.lava{
    position:absolute;
    width:180px;
    height:40px;
    background:#ff2600;
    border-radius:50%;
    filter:blur(14px);
    opacity:.55;
    animation:lavaMove 2s infinite alternate;
}

.l1{bottom:8%;left:5%}
.l2{bottom:15%;right:5%;animation-delay:.4s}
.l3{top:15%;left:25%;animation-delay:.8s}

@keyframes lavaMove{
    from{transform:scaleX(.8)}
    to{transform:scaleX(1.3)}
}

.dragonLogo{
    position:relative;
    z-index:2;
    font-size:110px;
    filter:drop-shadow(0 0 18px red);
    animation:float 2s infinite ease-in-out;
}

@keyframes float{
    50%{transform:translateY(-14px)}
}

.title{
    position:relative;
    z-index:2;
    font-size:42px;
    font-weight:900;
    letter-spacing:5px;
    color:#ff4925;
    text-shadow:0 0 10px #ff2100,0 0 35px #8b0000;
}

.subtitle{
    position:relative;
    z-index:2;
    margin-top:8px;
    color:#d8aaa0;
    letter-spacing:3px;
    font-size:11px;
}

#start{
    position:relative;
    z-index:2;
    margin-top:40px;
    padding:17px 58px;
    border:2px solid #ff6b42;
    border-radius:7px;
    background:linear-gradient(#db3418,#620900);
    color:white;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 0 25px #ff2100;
}

#start:active{
    transform:scale(.94);
}

/* GAME UI */

#ui{
    display:none;
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#playerInfo{
    position:absolute;
    top:15px;
    left:15px;
    width:210px;
    color:white;
}

#playerName{
    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
}

#hpBack{
    margin-top:6px;
    height:18px;
    border:2px solid #eee;
    background:#240000;
}

#hp{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#ff1600,#ff7b00);
}

#bossInfo{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:230px;
    color:white;
    text-align:center;
}

#bossName{
    font-size:12px;
    font-weight:bold;
}

#bossBack{
    margin-top:5px;
    height:15px;
    background:#222;
    border:1px solid white;
}

#bossHp{
    width:100%;
    height:100%;
    background:#eee;
}

#enemyCounter{
    position:absolute;
    top:18px;
    right:15px;
    color:white;
    font-weight:bold;
}

/* CONTROLLER */

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.25);
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:35px;
    top:35px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:rgba(255,50,20,.65);
    border:2px solid #ff7555;
}

#attack{
    position:absolute;
    right:25px;
    bottom:30px;
    width:100px;
    height:100px;
    border-radius:50%;
    background:radial-gradient(circle,#ff4b25,#670b00);
    border:3px solid #ff7658;
    color:white;
    font-size:15px;
    font-weight:bold;
    box-shadow:0 0 25px #ff2100;
    pointer-events:auto;
}

#attack:active{
    transform:scale(.9);
}

/* MESSAGE */

#message{
    display:none;
    position:absolute;
    inset:0;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.72);
    color:white;
    pointer-events:auto;
}

#message h1{
    font-size:50px;
    color:#ff4925;
    text-shadow:0 0 20px red;
}

#restart{
    margin-top:25px;
    padding:13px 35px;
    border:2px solid #ff6544;
    background:#8d1607;
    color:white;
    border-radius:6px;
    font-size:17px;
}

.damageText{
    position:absolute;
    color:#ff3b20;
    font-size:28px;
    font-weight:bold;
    pointer-events:none;
    animation:damage .7s forwards;
}

@keyframes damage{
    to{
        transform:translateY(-60px);
        opacity:0;
    }
}
</style>
</head>

<body>

<div id="menu">
    <div class="lava l1"></div>
    <div class="lava l2"></div>
    <div class="lava l3"></div>

    <div class="dragonLogo">🐉</div>

    <div class="title">DRAGON HUNTER Z</div>

    <div class="subtitle">
        THE LAST DRAGON WARRIOR
    </div>

    <button id="start">GAME START</button>
</div>

<div id="ui">

    <div id="playerInfo">
        <div id="playerName">DRAGON WARRIOR</div>
        <div id="hpBack">
            <div id="hp"></div>
        </div>
    </div>

    <div id="bossInfo">
        <div id="bossName">DANGER ZOMBIE</div>
        <div id="bossBack">
            <div id="bossHp"></div>
        </div>
    </div>

    <div id="enemyCounter">
        ZOMBIE: <span id="count">0</span>
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="attack">
        DRAGON<br>SLASH
    </button>

    <div id="message">
        <h1 id="messageTitle">VICTORY</h1>
        <button id="restart">PLAY AGAIN</button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   DRAGON HUNTER Z V2
===================================================== */

let scene,camera,renderer;
let player;
let enemies=[];
let boss=null;

let game=false;
let hp=100;

let moveX=0;
let moveY=0;

let attacking=false;
let attackCooldown=false;


/* =====================================================
   MATERIAL
===================================================== */

const redMat =
new THREE.MeshStandardMaterial({
    color:0x8e1105,
    metalness:.75,
    roughness:.28
});

const darkRedMat =
new THREE.MeshStandardMaterial({
    color:0x350603,
    metalness:.65,
    roughness:.35
});

const blackMat =
new THREE.MeshStandardMaterial({
    color:0x111111,
    metalness:.55,
    roughness:.4
});

const whiteMat =
new THREE.MeshStandardMaterial({
    color:0xe9e9e9,
    metalness:.7,
    roughness:.25
});

const lavaMat =
new THREE.MeshBasicMaterial({
    color:0xff2500
});


/* =====================================================
   START
===================================================== */

document.getElementById("start").onclick=()=>{
    document.getElementById("menu").style.display="none";
    document.getElementById("ui").style.display="block";
    init();
};


/* =====================================================
   INIT
===================================================== */

function init(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x090303);

    scene.fog=new THREE.Fog(
        0x090303,
        15,
        55
    );


    camera=new THREE.PerspectiveCamera(
        65,
        innerWidth/innerHeight,
        .1,
        1000
    );


    renderer=
    new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,1.5)
    );

    renderer.shadowMap.enabled=true;

    document.body.appendChild(
        renderer.domElement
    );


    /* LIGHT */

    const ambient=
    new THREE.HemisphereLight(
        0xff5533,
        0x080808,
        1.8
    );

    scene.add(ambient);


    const moon=
    new THREE.DirectionalLight(
        0xffd2c0,
        2
    );

    moon.position.set(
        -10,
        20,
        10
    );

    moon.castShadow=true;

    scene.add(moon);


    const fire=
    new THREE.PointLight(
        0xff2100,
        8,
        35
    );

    fire.position.set(
        0,
        4,
        -8
    );

    scene.add(fire);


    createArena();


    player=createPlayer();

    player.position.set(
        0,0,8
    );

    scene.add(player);


    createZombies();

    createBoss();


    game=true;

    updateUI();

    animate();
}


/* =====================================================
   ARENA
===================================================== */

function createArena(){

    const ground=
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            100,
            100
        ),
        new THREE.MeshStandardMaterial({
            color:0x15100e,
            roughness:1
        })
    );

    ground.rotation.x=-Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);


    /* STONE BLOCKS */

    for(let i=0;i<35;i++){

        const rock=
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                Math.random()*.8+.3
            ),
            new THREE.MeshStandardMaterial({
                color:0x24201d,
                roughness:1
            })
        );

        rock.position.set(
            (Math.random()-.5)*50,
            .3,
            (Math.random()-.5)*40
        );

        scene.add(rock);
    }


    /* LAVA POOLS */

    for(let i=0;i<12;i++){

        const lava=
        new THREE.Mesh(
            new THREE.CircleGeometry(
                Math.random()*1.5+1,
                16
            ),
            lavaMat
        );

        lava.rotation.x=-Math.PI/2;

        lava.position.set(
            (Math.random()-.5)*40,
            .025,
            (Math.random()-.5)*30
        );

        scene.add(lava);
    }


    /* RUINS */

    for(let x=-20;x<=20;x+=10){

        const wall=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3,
                5,
                2
            ),
            new THREE.MeshStandardMaterial({
                color:0x25201d
            })
        );

        wall.position.set(
            x,
            2.5,
            -15
        );

        scene.add(wall);
    }

}


/* =====================================================
   PLAYER
===================================================== */

function createPlayer(){

    const g=
    new THREE.Group();


    /* BODY ARMOR */

    const body=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .7,
            .85,
            1.7,
            8
        ),
        redMat
    );

    body.position.y=1.2;

    body.castShadow=true;

    g.add(body);


    /* CHEST PLATE */

    const chest=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.45,
            .9,
            .55
        ),
        darkRedMat
    );

    chest.position.set(
        0,
        1.55,
        -.35
    );

    g.add(chest);


    /* LAVA CORE */

    const core=
    new THREE.Mesh(
        new THREE.OctahedronGeometry(.25),
        new THREE.MeshBasicMaterial({
            color:0xff4b00
        })
    );

    core.position.set(
        0,
        1.55,
        -.65
    );

    g.add(core);


    /* HEAD */

    const head=
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .62,
            16,
            12
        ),
        redMat
    );

    head.position.y=2.55;

    g.add(head);


    /* HELMET */

    const helmet=
    new THREE.Mesh(
        new THREE.ConeGeometry(
            .72,
            .75,
            8
        ),
        darkRedMat
    );

    helmet.position.y=2.9;

    g.add(helmet);


    /* HORNS */

    [-1,1].forEach(s=>{

        const horn=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .16,
                .75,
                8
            ),
            darkRedMat
        );

        horn.position.set(
            s*.42,
            3.25,
            0
        );

        horn.rotation.z=s*.45;

        g.add(horn);

    });


    /* EYES */

    [-1,1].forEach(s=>{

        const eye=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .075,
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color:0xffd000
            })
        );

        eye.position.set(
            s*.23,
            2.58,
            -.57
        );

        g.add(eye);

    });


    /* WINGS */

    [-1,1].forEach(s=>{

        const wing=
        new THREE.Mesh(
            new THREE.BufferGeometry(),
            darkRedMat
        );

        const vertices=new Float32Array([
            0,0,0,
            s*1.4,.4,.1,
            s*.8,1.8,0
        ]);

        wing.geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(
                vertices,3
            )
        );

        wing.geometry.computeVertexNormals();

        wing.position.set(
            0,
            1.6,
            .25
        );

        g.add(wing);

    });


    /* SHOULDER ARMOR */

    [-1,1].forEach(s=>{

        const shoulder=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .38,
                10,
                10
            ),
            redMat
        );

        shoulder.position.set(
            s*.85,
            1.85,
            0
        );

        g.add(shoulder);

    });


    /* SWORD */

    const sword=
    new THREE.Group();

    const blade=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .16,
            2.1,
            .12
        ),
        new THREE.MeshStandardMaterial({
            color:0xcfd4d8,
            metalness:1,
            roughness:.15
        })
    );

    blade.position.y=1;

    sword.add(blade);


    const guard=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .8,
            .12,
            .18
        ),
        redMat
    );

    sword.add(guard);


    const handle=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .08,
            .08,
            .7,
            8
        ),
        blackMat
    );

    handle.position.y=-.4;

    sword.add(handle);


    sword.position.set(
        .95,
        1.2,
        -.1
    );

    sword.rotation.z=-.5;

    g.add(sword);

    g.userData.sword=sword;

    return g;
}


/* =====================================================
   ZOMBIE
===================================================== */

function createZombie(){

    const g=
    new THREE.Group();


    const body=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .65,
            .8,
            1.6,
            7
        ),
        blackMat
    );

    body.position.y=1;

    g.add(body);


    const head=
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .65,
            12,
            10
        ),
        blackMat
    );

    head.position.y=2.25;

    g.add(head);


    /* JAW */

    const jaw=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .65,
            .2,
            .4
        ),
        new THREE.MeshStandardMaterial({
            color:0x333333
        })
    );

    jaw.position.set(
        0,
        2.05,
        -.55
    );

    g.add(jaw);


    /* EYES */

    [-1,1].forEach(s=>{

        const eye=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .08,
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color:0xff1600
            })
        );

        eye.position.set(
            s*.22,
            2.3,
            -.58
        );

        g.add(eye);

    });


    /* ARMOR */

    const armor=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.5,
            .55,
            .7
        ),
        new THREE.MeshStandardMaterial({
            color:0x202020,
            metalness:.6
        })
    );

    armor.position.y=1.35;

    g.add(armor);


    g.userData.hp=100;

    return g;
}


/* =====================================================
   DANGER ZOMBIE BOSS
===================================================== */

function createDangerZombie(){

    const g=
    new THREE.Group();


    /* BODY */

    const body=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            1,
            1.15,
            2.4,
            8
        ),
        whiteMat
    );

    body.position.y=1.5;

    g.add(body);


    /* CHEST */

    const chest=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2,
            1.2,
            .8
        ),
        whiteMat
    );

    chest.position.set(
        0,
        1.7,
        -.35
    );

    g.add(chest);


    /* RED CORE */

    const core=
    new THREE.Mesh(
        new THREE.OctahedronGeometry(.35),
        new THREE.MeshBasicMaterial({
            color:0xff1300
        })
    );

    core.position.set(
        0,
        1.7,
        -.8
    );

    g.add(core);


    /* HEAD */

    const head=
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .9,
            16,
            12
        ),
        whiteMat
    );

    head.position.y=3.15;

    g.add(head);


    /* HELMET */

    const helmet=
    new THREE.Mesh(
        new THREE.ConeGeometry(
            1,
            1,
            8
        ),
        whiteMat
    );

    helmet.position.y=3.7;

    g.add(helmet);


    /* BLACK VISOR */

    const visor=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .9,
            .35,
            .15
        ),
        blackMat
    );

    visor.position.set(
        0,
        3.15,
        -.8
    );

    g.add(visor);


    /* SPIKES */

    [-1,1].forEach(s=>{

        for(let i=0;i<2;i++){

            const spike=
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    .16,
                    .8,
                    6
                ),
                whiteMat
            );

            spike.position.set(
                s*(.8+i*.25),
                2+i*.5,
                0
            );

            spike.rotation.z=s*.6;

            g.add(spike);
        }

    });


    /* SHOULDER */

    [-1,1].forEach(s=>{

        const shoulder=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .55,
                10,
                10
            ),
            whiteMat
        );

        shoulder.position.set(
            s*1.15,
            2.15,
            0
        );

        g.add(shoulder);

    });


    g.userData.hp=500;
    g.userData.boss=true;

    return g;
}


/* =====================================================
   SPAWN ZOMBIES
===================================================== */

function createZombies(){

    const positions=[
        [-5,-3],
        [5,-3],
        [-7,-8],
        [7,-8],
        [-3,-12],
        [3,-12]
    ];

    positions.forEach(p=>{

        const z=createZombie();

        z.position.set(
            p[0],
            0,
            p[1]
        );

        scene.add(z);

        enemies.push(z);
    });

    updateUI();
}


/* =====================================================
   SPAWN BOSS
===================================================== */

function createBoss(){

    boss=createDangerZombie();

    boss.position.set(
        0,
        0,
        -19
    );

    boss.scale.set(
        1.3,
        1.3,
        1.3
    );

    scene.add(boss);
}


/* =====================================================
   ATTACK
===================================================== */

document.getElementById("attack").onclick=attack;

function attack(){

    if(!game || attackCooldown)
        return;

    attackCooldown=true;
    attacking=true;


    const sword=
    player.userData.sword;

    sword.rotation.z=-1.6;


    setTimeout(()=>{

        sword.rotation.z=-.5;
        attacking=false;

    },180);


    /* FIND CLOSEST */

    let target=null;
    let closest=Infinity;


    enemies.forEach(e=>{

        const d=
        player.position.distanceTo(
            e.position
        );

        if(d<closest){

            closest=d;
            target=e;

        }
    });


    if(
        target &&
        closest<4
    ){

        target.userData.hp-=50;

        damageEffect(target.position);


        if(target.userData.hp<=0){

            scene.remove(target);

            enemies=
            enemies.filter(
                e=>e!==target
            );

            updateUI();
        }
    }


    /* BOSS */

    if(
        boss &&
        player.position.distanceTo(
            boss.position
        )<5
    ){

        boss.userData.hp-=40;

        damageEffect(
            boss.position
        );

        updateUI();


        if(boss.userData.hp<=0){

            scene.remove(boss);

            boss=null;

            victory();

        }

    }


    setTimeout(()=>{
        attackCooldown=false;
    },450);
}


/* =====================================================
   DAMAGE EFFECT
===================================================== */

function damageEffect(pos){

    const vector=
    pos.clone();

    vector.project(camera);

    const x=
        (vector.x*.5+.5)*
        innerWidth;

    const y=
        (-vector.y*.5+.5)*
        innerHeight;

    const text=
    document.createElement("div");

    text.className="damageText";

    text.textContent="-40";

    text.style.left=x+"px";
    text.style.top=y+"px";

    document.body.appendChild(text);

    setTimeout(()=>{
        text.remove();
    },700);
}


/* =====================================================
   JOYSTICK
===================================================== */

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");

let touching=false;

joystick.addEventListener(
    "touchstart",
    e=>{
        touching=true;
        moveStick(e.touches[0]);
    }
);

joystick.addEventListener(
    "touchmove",
    e=>{
        if(touching)
            moveStick(e.touches[0]);
    }
);

joystick.addEventListener(
    "touchend",
    ()=>{
        touching=false;

        moveX=0;
        moveY=0;

        stick.style.left="35px";
        stick.style.top="35px";
    }
);


function moveStick(touch){

    const rect=
    joystick.getBoundingClientRect();

    let x=
        touch.clientX-
        (rect.left+65);

    let y=
        touch.clientY-
        (rect.top+65);

    const max=42;

    const length=
        Math.sqrt(x*x+y*y);

    if(length>max){

        x=x/length*max;
        y=y/length*max;

    }

    moveX=x/max;
    moveY=y/max;

    stick.style.left=
        (35+x)+"px";

    stick.style.top=
        (35+y)+"px";
}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(!game)
        return;


    const speed=.13;


    player.position.x+=
        moveX*speed;

    player.position.z+=
        moveY*speed;


    /* BOUNDARY */

    player.position.x=
        Math.max(
            -22,
            Math.min(
                22,
                player.position.x
            )
        );

    player.position.z=
        Math.max(
            -25,
            Math.min(
                12,
                player.position.z
            )
        );


    /* PLAYER ROTATION */

    if(
        Math.abs(moveX)+
        Math.abs(moveY)>.1
    ){

        player.rotation.y=
            Math.atan2(
                moveX,
                moveY
            );
    }


    /* CAMERA */

    camera.position.x=
        player.position.x;

    camera.position.y=6.5;

    camera.position.z=
        player.position.z+10;

    camera.lookAt(
        player.position.x,
        1.5,
        player.position.z-3
    );


    /* ZOMBIE AI */

    enemies.forEach(z=>{

        const dir=
        new THREE.Vector3()
        .subVectors(
            player.position,
            z.position
        );

        const distance=
            dir.length();

        dir.normalize();


        if(distance>1.8){

            z.position.add(
                dir.multiplyScalar(.028)
            );

        }else{

            hp-=.045;

            updateUI();

            if(hp<=0){

                gameOver();

            }

        }

    });


    /* BOSS AI */

    if(boss){

        const dir=
        new THREE.Vector3()
        .subVectors(
            player.position,
            boss.position
        );

        const distance=
            dir.length();

        dir.normalize();


        if(distance>3){

            boss.position.add(
                dir.multiplyScalar(.018)
            );

        }else{

            hp-=.09;

            updateUI();

            if(hp<=0){

                gameOver();

            }
        }
    }

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    document.getElementById(
        "hp"
    ).style.width=
        Math.max(hp,0)+"%";


    document.getElementById(
        "count"
    ).textContent=
        enemies.length;


    document.getElementById(
        "bossHp"
    ).style.width=
        boss?
        Math.max(
            boss.userData.hp/500*100,
            0
        )+"%":
        "0%";
}


/* =====================================================
   VICTORY
===================================================== */

function victory(){

    game=false;

    document.getElementById(
        "message"
    ).style.display="flex";

    document.getElementById(
        "messageTitle"
    ).textContent=
        "VICTORY";
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    if(!game)
        return;

    game=false;

    document.getElementById(
        "message"
    ).style.display="flex";

    document.getElementById(
        "messageTitle"
    ).textContent=
        "GAME OVER";
}


/* =====================================================
   RESTART
===================================================== */

document.getElementById(
    "restart"
).onclick=()=>{
    location.reload();
};


/* =====================================================
   LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        if(!camera)
            return;

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
